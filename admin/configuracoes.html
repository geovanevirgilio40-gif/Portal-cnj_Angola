<!doctype html>
<html lang="pt-AO" data-root="../">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>Configurações institucionais | Administração CNJ</title>
  <meta name="theme-color" content="#06152e">
  <link rel="icon" href="../assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="../css/admin.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body class="admin-body" data-section="configuracoes">
  <a class="skip-link" href="#conteudo">Saltar para o conteúdo</a>
  <noscript><p class="noscript">A área administrativa necessita de JavaScript.</p></noscript>
  <div class="admin-shell">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="admin-main">
      <header class="admin-header" id="admin-header" data-title="Configurações institucionais"></header>
      <main class="admin-content" id="conteudo" tabindex="-1"><div id="page-content"></div></main>
    </div>
  </div>
  <div class="scrim" id="scrim" hidden></div>
  <template id="page-template">
    <div id="settings-status"></div>
    <form id="settings-form" class="box" novalidate hidden>
      <h2>Identificação</h2>
      <div class="form-row"><div class="field"><label for="s-nome">Nome da instituição</label><input id="s-nome" name="nome" type="text" required maxlength="160"></div><div class="field"><label for="s-sigla">Sigla</label><input id="s-sigla" name="sigla" type="text" required maxlength="20"></div></div>
      <div id="logo-picker"></div>
      <h2>Contactos</h2>
      <div class="form-row"><div class="field"><label for="s-email">Email institucional</label><input id="s-email" name="email" type="email" ></div><div class="field"><label for="s-telefone">Telefone</label><input id="s-telefone" name="telefone" type="tel" ></div></div>
      <div class="form-row"><div class="field"><label for="s-endereco">Endereço</label><input id="s-endereco" name="endereco" type="text" maxlength="240"></div><div class="field"><label for="s-horario">Horário de atendimento</label><input id="s-horario" name="horario" type="text" maxlength="120"></div></div>
      <h2>Redes sociais</h2>
      <div class="form-row"><div class="field"><label for="s-facebook">Facebook</label><input id="s-facebook" name="facebook" type="url" placeholder="https://"></div><div class="field"><label for="s-instagram">Instagram</label><input id="s-instagram" name="instagram" type="url" placeholder="https://"></div></div>
      <div class="form-row"><div class="field"><label for="s-youtube">YouTube</label><input id="s-youtube" name="youtube" type="url" placeholder="https://"></div><div class="field"><label for="s-x">X</label><input id="s-x" name="x" type="url" placeholder="https://"></div></div>
      <div class="form-actions"><button type="reset" class="btn btn-outline">Repor valores</button><button type="submit" class="btn">Guardar configurações</button></div>
    </form>
    <section class="box box-gap" id="demo-tools" style="margin-top:20px"><h2>Dados de demonstração</h2><p>Apague as alterações locais e volte aos exemplos iniciais.</p><button type="button" class="btn btn-danger" id="reset-demo">Repor dados de demonstração</button></section>
  </template>
  <script src="../js/config.js"></script>
  <script src="../js/core/ui.js"></script>
  <script src="../js/core/forms.js"></script>
  <script src="../js/services/api.js"></script>
  <script src="../js/services/auth.js"></script>
  <script src="../js/data/demo-data.js"></script>
  <script src="../js/services/repository.js"></script>
  <script src="../js/admin/painel.js"></script>
  <script src="../js/admin/imagens.js"></script>
  <script src="../js/admin/configuracoes.js"></script>
</body>
</html>
