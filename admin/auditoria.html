<!doctype html>
<html lang="pt-AO" data-root="../">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>Auditoria | Administração CNJ</title>
  <meta name="theme-color" content="#06152e">
  <link rel="icon" href="../assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="../css/admin.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body class="admin-body" data-section="auditoria">
  <a class="skip-link" href="#conteudo">Saltar para o conteúdo</a>
  <noscript><p class="noscript">A área administrativa necessita de JavaScript.</p></noscript>
  <div class="admin-shell">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="admin-main">
      <header class="admin-header" id="admin-header" data-title="Auditoria"></header>
      <main class="admin-content" id="conteudo" tabindex="-1"><div id="page-content"></div></main>
    </div>
  </div>
  <div class="scrim" id="scrim" hidden></div>
  <template id="page-template">
    <div class="admin-intro"><p>Consulte quem criou, editou ou eliminou conteúdos, e quando. O registo é apenas de leitura; na versão final tem de ser escrito pelo servidor.</p></div>
    <form class="toolbar" id="audit-filters" novalidate>
      <div class="field field-grow"><label for="a-q">Utilizador ou registo</label><input id="a-q" name="q" type="search" autocomplete="off"></div>
      <div class="field"><label for="a-accao">Operação</label><select id="a-accao" name="accao"><option value="">Todas</option><option value="criou">Criou</option><option value="editou">Editou</option><option value="eliminou">Eliminou</option></select></div>
      <div class="field"><label for="a-tipo">Tipo</label><select id="a-tipo" name="tipo"><option value="">Todos</option><option>Publicação</option><option>Notícia</option><option>Fotografia</option><option>Evento</option><option>Administrador</option><option>Configurações</option></select></div>
      <div class="field"><label for="a-de">Desde</label><input id="a-de" name="de" type="date"></div>
      <div class="field"><label for="a-ate">Até</label><input id="a-ate" name="ate" type="date"></div>
      <button type="reset" class="btn btn-outline">Limpar filtros</button>
    </form>
    <p class="result-count" id="audit-count" aria-live="polite"></p><div id="audit-list"></div><nav class="pagination" id="audit-pages" aria-label="Paginação"></nav>
  </template>
  <script src="../js/config.js"></script>
  <script src="../js/core/ui.js"></script>
  <script src="../js/core/forms.js"></script>
  <script src="../js/services/api.js"></script>
  <script src="../js/services/auth.js"></script>
  <script src="../js/data/demo-data.js"></script>
  <script src="../js/services/repository.js"></script>
  <script src="../js/admin/painel.js"></script>
  <script src="../js/admin/auditoria.js"></script>
</body>
</html>
