<!doctype html>
<html lang="pt-AO">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Contactos | CNJ Angola</title>
  <meta name="description" content="Contactos do Conselho Nacional de Juventude de Angola.">
  <meta name="theme-color" content="#0b2347">
  <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body data-page="contactos">
  <a class="skip-link" href="#conteudo">Saltar para o conteúdo</a>
  <header id="site-header"></header>
  <noscript><p class="noscript">Active o JavaScript no navegador para usar o menu e ver os conteúdos do portal.</p></noscript>
  <main id="conteudo" tabindex="-1">
    <div class="page-banner"><div class="container">
      <nav aria-label="Localização"><ol class="breadcrumb"><li><a href="index.html">Início</a></li><li aria-current="page">Contactos</li></ol></nav>
      <h1 id="banner-title">Contactos</h1><p>Fale com o Conselho Nacional de Juventude.</p></div></div>
    <div class="section section-mist"><div class="container two-columns">
      <div>
        <h2>Contactos institucionais</h2>
        <ul class="contact-list" id="contact-data"></ul>
        <h3>Redes sociais</h3>
        <div id="contact-social"></div>
      </div>
      <div class="panel">
        <h2>Enviar mensagem</h2>
        <p class="alert alert-warning" id="contact-notice">O envio de mensagens ainda não está disponível. Pode experimentar o formulário, mas nada será enviado.</p>
        <form id="contact-form" novalidate>
          <div class="form-row">
            <div class="field"><label for="c-nome">Nome completo</label><input id="c-nome" name="nome" autocomplete="name" required minlength="3" maxlength="120"></div>
            <div class="field"><label for="c-email">Email</label><input id="c-email" name="email" type="email" autocomplete="email" required maxlength="160"></div>
          </div>
          <div class="field"><label for="c-assunto">Assunto</label><input id="c-assunto" name="assunto" required maxlength="160"></div>
          <div class="field"><label for="c-mensagem">Mensagem</label><textarea id="c-mensagem" name="mensagem" required minlength="10" maxlength="3000"></textarea></div>
          <div class="form-actions"><button type="reset" class="btn btn-outline">Limpar</button><button type="submit" class="btn">Enviar mensagem</button></div>
          <p id="contact-result" role="status" hidden></p>
        </form>
      </div>
    </div></div>
  </main>
  <footer id="site-footer"></footer>
  <script src="js/config.js"></script>
  <script src="js/core/ui.js"></script>
  <script src="js/core/forms.js"></script>
  <script src="js/services/api.js"></script>
  <script src="js/data/demo-data.js"></script>
  <script src="js/services/repository.js"></script>
  <script src="js/navigation.js"></script>
  <script src="js/public/componentes.js"></script>
  <script src="js/public/contactos.js"></script>
</body>
</html>
